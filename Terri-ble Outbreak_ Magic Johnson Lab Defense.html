<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Terri-ble Outbreak: Magic Johnson Lab Defense</title>
<style>
:root{--bg:#0d151c;--panel:#141f29;--panel2:#1b2935;--line:#2a3c4c;--txt:#eaf3f9;--mut:#8ea4b5;--g:#5dff9c;--gd:#1f9a55;--y:#ffd23f;--yd:#b8901a;--p:#ff5d8f;--pd:#b0325b;--c:#5ad1ff;--v:#b38cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05090c;color:var(--txt);font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Trebuchet MS",system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
#app{position:relative;height:100vh;height:100dvh;max-width:620px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#hud{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(#1b2a37,#111a23);border-bottom:2px solid #000;flex:0 0 auto}
.hb{display:flex;align-items:center;gap:5px;background:#0b1218;border:1px solid var(--line);border-radius:10px;padding:4px 8px;height:34px;font-weight:800;white-space:nowrap}
.hb small{font-size:9px;color:var(--mut);letter-spacing:.06em}
.hb.wave b{font-size:18px;color:var(--c)}
.hb.cash b{font-size:17px;color:var(--y);min-width:40px}
.hb.hp{flex:1;min-width:0;position:relative;padding:0;justify-content:center}
.hpbar{position:absolute;inset:3px;border-radius:7px;background:#3a1219;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4d6d,#ffb84d,#5dff9c);transition:width .25s}
.hb.hp span{position:relative;z-index:1;font-size:12px;text-shadow:0 1px 2px #000,0 0 4px #000}
.ib{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:#0b1218;font-weight:900;font-size:14px;padding:0;flex:0 0 auto}
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0a1117}
#cv{display:block;touch-action:none}
#toasts{position:absolute;top:46px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:6}
.toast{background:rgba(10,18,25,.92);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;max-width:92%;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:5;animation:ban 2.6s ease-out forwards}
.banner h3{margin:0;font-size:34px;font-weight:900;letter-spacing:.02em;text-shadow:0 3px 0 #000,0 0 18px currentColor;color:var(--g)}
.banner p{margin:4px 16px 0;font-size:14px;font-weight:700;text-shadow:0 2px 3px #000;color:#fff}
@keyframes ban{0%{transform:scale(.4);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#dock{padding:6px;background:#111a23;border-top:2px solid #000;display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.row{display:flex;gap:6px;align-items:stretch}
.scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
#wrow{min-height:42px}
.wchip{display:flex;align-items:center;gap:6px;flex:0 0 auto;background:#0b1218;border:2px solid var(--line);border-radius:12px;padding:3px 10px 3px 6px;text-align:left;line-height:1.05}
.wchip .i{font-size:22px}
.wchip b{font-size:12px;display:block}
.wchip small{font-size:10px;color:var(--mut)}
.wchip.on{border-color:var(--g);background:#0f2a1c;box-shadow:0 0 10px rgba(93,255,156,.35)}
.wchip.add{border-style:dashed;color:var(--y)}
.wchip.add.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 0 14px var(--y)}}
.btn{border-radius:12px;padding:8px 12px;font-weight:900;color:#05210f;background:var(--g);box-shadow:0 4px 0 var(--gd);position:relative;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn.shop{background:var(--v);box-shadow:0 4px 0 #6b47c2;color:#1a0b33;flex:0 0 auto}
.btn.shop .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--p);border:2px solid #111a23;display:none}
.btn.shop.new .dot{display:block}
.btn.go{flex:0 0 auto;min-width:112px}
.btn.go.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.25);transform:scale(1.04)}}
.btn.go.busy{background:#2a3a48;color:#cfe;box-shadow:0 4px 0 #18232c}
.btn.alt{background:#24384a;color:var(--txt);box-shadow:0 4px 0 #142230}
.btn.warn{background:var(--p);color:#2a0412;box-shadow:0 4px 0 var(--pd)}
.btn.gold{background:var(--y);color:#2a1d00;box-shadow:0 4px 0 var(--yd)}
#prow{flex:1;display:flex;gap:6px;min-width:0}
.pup{position:relative;flex:0 0 auto;width:46px;height:44px;border-radius:12px;background:#0b1218;border:2px solid var(--line);font-size:22px;overflow:hidden;padding:0}
.pup em{position:absolute;right:2px;bottom:0;font-style:normal;font-size:11px;font-weight:900;color:var(--y);text-shadow:0 1px 2px #000}
.pup em.c{color:#aaa;font-size:9px}
.pup .cdv{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
.pup.active{border-color:var(--y);box-shadow:0 0 10px var(--y)}
#sheet{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(3,8,12,.6)}
#sheet.hidden,#title.hidden{display:none}
.panel{max-height:90%;background:var(--panel);border-radius:18px 18px 0 0;border-top:3px solid var(--g);display:flex;flex-direction:column;animation:up .2s ease-out}
.panel.center{margin:auto 10px;border-radius:18px;border:3px solid var(--g)}
.panel.red{border-color:var(--p)}
@keyframes up{from{transform:translateY(30px);opacity:.3}}
.sh-head{display:flex;align-items:center;padding:12px 12px 8px;gap:8px;flex:0 0 auto}
.sh-head h2{margin:0;font-size:19px;flex:1;font-weight:900}
.cashtag{font-weight:900;color:var(--y);background:#0b1218;border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
.x{width:34px;height:34px;border-radius:50%;background:#24384a;font-weight:900}
.tabs{display:flex;gap:5px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 11px;border-radius:999px;background:#0b1218;border:1px solid var(--line);font-weight:800;font-size:13px}
.tab.on{background:var(--g);color:#05210f;border-color:var(--g)}
.sh-body{overflow-y:auto;padding:2px 10px 18px;-webkit-overflow-scrolling:touch}
.note{font-size:12px;color:var(--mut);margin:2px 2px 8px;line-height:1.35}
.card{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.card .ic{font-size:28px;flex:0 0 46px;height:46px;display:grid;place-items:center;background:#0b1218;border-radius:12px}
.card .cb{flex:1;min-width:0}
.nm{font-weight:900;font-size:14px;line-height:1.2}
.lv{color:var(--y);font-size:12px;white-space:nowrap}
.ms{color:#ffb84d;font-size:12px}
.q{color:var(--mut);font-size:12px;font-style:italic;margin-top:2px;line-height:1.3}
.d{font-size:12.5px;margin-top:3px;line-height:1.3}
.stats{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 2px}
.st{font-size:11px;background:#0b1218;border-radius:6px;padding:2px 6px;color:var(--mut)}
.st b{color:var(--c)}
.st i{color:var(--g);font-style:normal}
.acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.buy{border-radius:10px;padding:7px 12px;font-weight:900;font-size:13px;background:var(--y);color:#2a1d00;box-shadow:0 3px 0 var(--yd)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yd)}
.buy.no{filter:grayscale(.8);opacity:.55}
.buy.g{background:var(--g);color:#05210f;box-shadow:0 3px 0 var(--gd)}
.buy.p{background:var(--p);color:#2a0412;box-shadow:0 3px 0 var(--pd)}
.buy.dim{background:#2a3a48;color:#cfe;box-shadow:0 3px 0 #18232c}
.buy.sel{outline:2px solid var(--g)}
.card.locked{opacity:.6}
.card.locked .ic{filter:grayscale(1)}
.big-stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 10px}
.big-stat div{background:#0b1218;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mut)}
.big-stat b{display:block;font-size:20px;color:var(--txt)}
.center-btns{display:flex;flex-direction:column;gap:10px;padding:4px 14px 18px}
.center-btns .btn{padding:12px;font-size:16px}
.tgl{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:800;width:100%;text-align:left}
.tgl span.sw{width:44px;height:24px;border-radius:999px;background:#33475a;position:relative;flex:0 0 auto}
.tgl span.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on span.sw{background:var(--g)}
.tgl.on span.sw::after{left:23px}
.pedia canvas{flex:0 0 56px;width:56px;height:56px;background:#0b1218;border-radius:12px}
ul.how{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}
ul.how li{margin-bottom:6px}
#title{position:absolute;inset:0;z-index:30;overflow-y:auto;background:radial-gradient(circle at 50% 25%,#1d3d2c 0%,#0d151c 55%,#070b0f 100%)}
#title::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(93,255,156,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(93,255,156,.05) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.tt{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;text-align:center}
.tt .badge{font-size:11px;font-weight:900;letter-spacing:.2em;color:#111;background:var(--y);padding:4px 10px;border-radius:999px;transform:rotate(-2deg)}
.tt h1{margin:12px 0 4px;font-size:46px;line-height:.95;font-weight:900;color:var(--g);text-shadow:0 4px 0 #0a4d2a,0 0 30px rgba(93,255,156,.5);animation:wob 3s ease-in-out infinite}
.tt h1 span{color:var(--p);text-shadow:0 4px 0 #6b1430,0 0 30px rgba(255,93,143,.5);display:block;font-size:50px}
@keyframes wob{50%{transform:rotate(-1.5deg) scale(1.02)}}
.tt .sub{margin:6px 0 4px;color:#cfe3ee;font-size:14px;line-height:1.4}
#tcv{width:340px;max-width:100%;height:120px}
.tt .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px;margin-top:6px}
.tt .btns .btn{padding:13px;font-size:17px}
.tt .btns .btn small{display:block;font-size:11px;opacity:.75}
.tt .r4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.tt .r4 .btn{padding:10px 4px;font-size:15px}
.tt .stats{margin-top:14px;font-size:12px;color:var(--mut)}
.tt .stats b{color:var(--txt)}
.tt .foot{margin-top:6px;font-size:11px;color:#5e7384}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hb wave"><small>WAVE</small><b id="hWave">1</b></div>
    <div class="hb cash">💰<b id="hCash">0</b></div>
    <div class="hb hp"><div class="hpbar"><i id="hHp"></i></div><span id="hHpT">🧪 100/100</span></div>
    <button class="ib" id="spdBtn" aria-label="Game speed">1×</button>
    <button class="ib" id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="toasts"></div></div>
  <div id="dock">
    <div class="row scroll" id="wrow"></div>
    <div class="row">
      <button class="btn shop" id="shopBtn">🧪 SHOP<span class="dot"></span></button>
      <div class="scroll" id="prow"></div>
      <button class="btn go" id="goBtn">▶ WAVE 1</button>
    </div>
  </div>
  <div id="sheet" class="hidden"></div>
  <div id="title">
    <div class="tt">
      <div class="badge">☣ BIOSAFETY LEVEL: TERRI ☣</div>
      <h1>TERRI-BLE<span>OUTBREAK!</span></h1>
      <div class="sub">Defend the <b>Magic Johnson Lab</b> from every variant of zombie Terri.</div>
      <canvas id="tcv" width="680" height="240"></canvas>
      <div class="btns">
        <button class="btn gold" data-a="continue" id="tCont">▶ CONTINUE<small id="tContS"></small></button>
        <button class="btn" data-a="new">🧪 NEW EXPERIMENT</button>
        <div class="r4">
          <button class="btn alt" data-a="tenure">🎓 <span id="tCit">0</span></button>
          <button class="btn alt" data-a="ach" aria-label="Achievements">🏆</button>
          <button class="btn alt" data-a="pedia" aria-label="Terri-pedia">📖</button>
          <button class="btn alt" data-a="howto" aria-label="How to play">❓</button>
        </div>
      </div>
      <div class="stats" id="tStats"></div>
      <div class="foot">🎓 = Citations. Spend them on the Tenure Track for permanent upgrades.</div>
    </div>
  </div>
</div>
<script>
'use strict';
// ================= UTILS =================
const $ = s => document.querySelector(s);
const W = 600, H = 820;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const fmt = n => { n = Math.floor(n); if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k'; return n.toLocaleString('en-US'); };
const fmtN = n => n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : n >= 10 ? Math.round(n) + '' : n.toFixed(1);
const growth = L => (1 + 0.28 * (L - 1)) * Math.pow(1.04, L - 1);
const r1 = (b, L, k = 1.04) => b * Math.pow(k, L - 1);
const hpMul = w => (1 + 0.2 * (w - 1)) * Math.pow(1.052, w - 1);
const mastery = k => Math.floor(Math.log2(k / 25 + 1));

// ================= MAP =================
const PATH = [[80, -40], [80, 150], [520, 150], [520, 310], [80, 310], [80, 470], [520, 470], [520, 610], [300, 610], [300, 690]];
const SEGS = []; let PLEN = 0;
for (let i = 0; i < PATH.length - 1; i++) {
  const [x1, y1] = PATH[i], [x2, y2] = PATH[i + 1]; const len = Math.hypot(x2 - x1, y2 - y1);
  SEGS.push({ x1, y1, x2, y2, len, start: PLEN, dx: (x2 - x1) / len, dy: (y2 - y1) / len }); PLEN += len;
}
function posAt(d) {
  if (d <= 0) { const s = SEGS[0]; return [s.x1 + s.dx * d, s.y1 + s.dy * d, s.dx, s.dy]; }
  for (const s of SEGS) if (d <= s.start + s.len) { const k = d - s.start; return [s.x1 + s.dx * k, s.y1 + s.dy * k, s.dx, s.dy]; }
  const s = SEGS[SEGS.length - 1]; return [s.x2, s.y2, s.dx, s.dy];
}
// tower benches (first 8 open, rest via Bench Space Expansion)
const SLOTS = [[300, 230], [180, 390], [420, 390], [300, 540], [180, 230], [420, 230], [180, 540], [420, 540],
  [300, 390], [240, 70], [390, 70], [420, 662], [170, 655], [530, 70]];
const SCI = { x: 300, y: 752 };
const DOOR = { x: 300, y: 690 };

// ================= TERRIS =================
const ZT = {
  basic: { n: 'Zombie Terri', hp: 30, spd: 46, rew: 6, dmg: 5, r: 14, skin: '#9ccf6a', hair: '#6b3b1f', coat: '#eef2f5', d: 'The original. Still wants to borrow your pipettes. And your brains.' },
  fast: { n: 'Delta Variant Terri', hp: 18, spd: 88, rew: 6, dmg: 4, r: 12, skin: '#b5d65a', hair: '#c0392b', coat: '#ffe3e3', from: 3, d: 'Late for lab meeting. VERY fast. Fragile.' },
  tank: { n: 'Hazmat Terri', hp: 95, spd: 30, rew: 14, dmg: 12, r: 18, armor: 0.3, skin: '#8fc46a', hair: '#4a2a14', coat: '#f7c62f', pants: '#c99a12', from: 5, d: 'Hazmat suit blocks 30% of damage. Tesla, UV & CRISPR ignore armor.' },
  splitter: { n: 'Omicron Terri', hp: 40, spd: 48, rew: 8, dmg: 6, r: 15, skin: '#b48ce0', hair: '#3d1f5c', coat: '#efe6ff', from: 7, d: 'Undergoes mitosis when killed: splits into 3 Mini Terris.' },
  mini: { n: 'Mini Terri', hp: 10, spd: 72, rew: 2, dmg: 2, r: 9, skin: '#c7a6ec', hair: '#3d1f5c', coat: '#efe6ff', d: 'Daughter cell. Small, fast, annoying.' },
  shield: { n: 'Gel-Coated Terri', hp: 30, shield: 1.4, spd: 42, rew: 11, dmg: 8, r: 15, skin: '#7fcf9a', hair: '#2a4d6b', coat: '#e3f1ff', from: 9, d: 'Cast in 1% agarose. Shield soaks damage and ignores slows.' },
  healer: { n: 'Grad Student Terri', hp: 38, spd: 44, rew: 12, dmg: 6, r: 14, skin: '#a8d47a', hair: '#222222', coat: '#f2f2f2', pants: '#3b5998', from: 11, d: 'Brought snacks for everyone. Heals nearby Terris. Kill her first!' },
  regen: { n: 'Antibody Terri', hp: 45, spd: 46, rew: 10, dmg: 7, r: 15, skin: '#9fd18a', hair: '#ff6fa8', coat: '#fff0f6', from: 13, d: 'Has antibodies. Regenerates if you stop hitting her.' },
};
const BOSSES = [
  { n: 'Patient Zero Terri', bk: 'zero', hpx: 40, spd: 30, r: 30, skin: '#7fbf55', hair: '#5a2e12', coat: '#e9eef2', d: 'Where it all began. Wears the crown of contamination.' },
  { n: 'Superspreader Terri', bk: 'spreader', hpx: 36, spd: 32, r: 30, skin: '#93c95e', hair: '#8e44ad', coat: '#e9f7e9', d: 'Sneezes out fresh Terris every few seconds. Bless you.' },
  { n: 'Tenured Professor Terri', bk: 'tenure', hpx: 40, spd: 28, r: 32, skin: '#86b86a', hair: '#9aa0a6', coat: '#f0ece2', d: 'Has tenure. Cannot be fired. Regrows a shield of job security.' },
  { n: 'Terri-Rex', bk: 'rex', hpx: 38, spd: 40, r: 32, skin: '#6fae4b', hair: '#2e5d1f', coat: '#d8f0c8', d: 'Charges forward every few seconds. RAWR means "I love pipettes" in dinosaur.' },
  { n: 'Mitosis Prime Terri', bk: 'mitosis', hpx: 34, spd: 32, r: 32, skin: '#b48ce0', hair: '#3d1f5c', coat: '#efe6ff', d: 'Two heads. Splits into two Daughter Cell bosses when defeated.' },
  { n: 'Principal Investigator Terri', bk: 'pi', hpx: 45, spd: 28, r: 34, armor: 0.25, skin: '#8cc070', hair: '#5b3a1e', coat: '#ffffff', d: 'Wants that data by Monday. Armored, and heals her whole lab.' },
];
const DAUGHTER = { n: 'Daughter Cell Terri', bk: 'daughter', r: 22, spd: 38, skin: '#c7a6ec', hair: '#3d1f5c', coat: '#efe6ff', d: 'Half the size, all of the attitude.' };

// ================= WEAPONS (hand-held) =================
const WEAPONS = {
  m4: { n: 'Eppendorf M4 Repeating Pipette', s: 'M4 Pipette', ic: '💧', col: '#6fd6ff', cost: 0, up: 50, unlock: 1,
    q: 'Dispenses justice in precise 50 µL aliquots.',
    st: L => { const g = growth(L); return { dmg: 9 * g, rate: r1(4.5, L), range: 330 + 8 * L, shots: 1 + Math.floor((L - 1) / 5) }; },
    sp: s => `×${s.shots} multi-dispense` },
  etoh: { n: '70% Ethanol Squirt Bottle', s: 'EtOH Squirt', ic: '🧴', col: '#e6f7ff', cost: 350, up: 120, unlock: 3,
    q: 'Kills 99.9% of Terris. The other 0.1% get a stern look.',
    st: L => { const g = growth(L); return { dmg: 6 * g, rate: r1(2.2, L, 1.03), range: 230 + 6 * L, count: 5 + Math.floor(L / 3), pierce: 1 }; },
    sp: s => `${s.count} droplets, pierce` },
  tips: { n: 'Tip Box Shotgun', s: 'Tip Shotgun', ic: '📦', col: '#ffd86b', cost: 600, up: 180, unlock: 6,
    q: 'Sterile. Filtered. Extremely pointy.',

const Cloud = { ref: null, busy: false, pending: false, timer: 0, last: '' };
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function cloudInit() {
  try {
    for (let i = 0; i < 25 && !(window.claude && typeof window.claude.use === 'function'); i++) await sleep(200);
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection('data/users/' + id).doc('save');
    const snap = await Promise.race([ref.get(), sleep(10000).then(() => null)]);
    if (snap && snap.exists) {
      const d = snap.data();
      if (d && d.blob && (d.updatedAt || 0) > (SAVE.updatedAt || 0) && (!S || S.phase === 'title')) {
        applySave(JSON.parse(d.blob));
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { }
        refreshTitle(); toast('☁️ Lab progress synced');
      }
    }
    Cloud.ref = ref;
    if (SAVE.updatedAt && (!snap || !snap.exists || ((snap.data() || {}).updatedAt || 0) < SAVE.updatedAt)) cloudQueue();
  } catch (e) { }
}
function cloudQueue() { if (!Cloud.ref) return; clearTimeout(Cloud.timer); Cloud.timer = setTimeout(cloudFlush, 3000); }
async function cloudFlush() {
  if (!Cloud.ref) return;
  if (Cloud.busy) { Cloud.pending = true; return; }
  const blob = JSON.stringify(SAVE); if (blob === Cloud.last) return;
  Cloud.busy = true;
  try { await Cloud.ref.set({ blob, updatedAt: SAVE.updatedAt }); Cloud.last = blob; }
  catch (e) { const c = e && e.code; if (c && c !== 'unavailable' && c !== 'resource_exhausted') Cloud.ref = null; }
  Cloud.busy = false;
  if (Cloud.pending) { Cloud.pending = false; cloudQueue(); }
}

let AC = null, master = null, noiseBuf = null; const lastS = {};
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => { }); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.22; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f1, f2, dur, type = 'sine', vol = 0.3, delay = 0) {
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1200, delay = 0, type = 'lowpass') {

}

}

}

}

    <li>💧 Your scientist auto-fires the equipped weapon (at reduced speed). <b>Hold your finger on the map</b> to aim manually at full speed.</li>
    <li>➕ Tap an empty bench to build lab defenses (turrets, Tesla coils, fume hoods…). Tap a built one to upgrade, retarget or sell.</li>
    <li>💰 Every Terri pays out. Combos (rapid kills) pay up to +50%. Clearing a wave pays a bonus.</li>
    <li>🧪 The SHOP has weapons, power-ups, skills (boost everything) and lab upgrades. Everything levels up.</li>
    <li>🔓 New weapons, defenses and power-ups are discovered as you reach higher waves: roughly every 5.</li>
    <li>👑 Every 5th wave is a boss. Every boss is a different (worse) Terri.</li>
    <li>🎓 When the lab falls you earn Citations. Spend them on the Tenure Track for permanent upgrades, then try to beat your best wave.</li>
    <li>⌨️ Desktop: Space = start wave, S = shop, 1–9 = switch weapon.</li></ul>
    <div class="center-btns" style="padding:12px 0 0"><button class="btn" data-a="close">GOT IT</button></div></div>`);
}
sheet.addEventListener('click', e => {
  if (e.target === sheet) { if (!['over', 'unlock'].includes(sheetKind)) closeSheet(); return; }
  const b = e.target.closest('[data-a]'); if (b) act(b.dataset.a, b.dataset.k);
});
$('#title').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) { ensureAudio(); act(b.dataset.a, b.dataset.k); } });
function act(a, k) {
  switch (a) {
    case 'close': sfx('click'); closeSheet(); if (S && S.phase === 'over' && S.overInfo) openOver(S.overInfo.cit, S.overInfo.rec); return;
    case 'tab': shopTab = k; sfx('click'); refreshSheet(); return;
    case 'buyW': buyWeapon(k); break;
    case 'upW': upgradeWeapon(k); break;
    case 'eqW': equipW(k); sfx('click'); break;
    case 'buyP': buyPup(k); break;
    case 'sk': buySkill('skills', k); break;
    case 'lab': buySkill('lab', k); break;
    case 'repair': repairLab(); break;
    case 'build': buildTower(selSlot, k); break;
    case 'upT': upgradeTower(selSlot); break;
    case 'sellT': sellTower(selSlot); closeSheet(); return;
    case 'modeT': S.towers[selSlot].mode = k; sfx('click'); break;
    case 'perk': buyPerk(k); break;
    case 'shopnow': closeSheet(); openShop('weapons'); return;
    case 'toggle': SAVE.settings[k] = SAVE.settings[k] ? 0 : 1; persist(); if (k === 'autoWave' && S && S.phase === 'build') S.autoT = SAVE.settings[k] ? 4 : 0; break;
    case 'quit': saveRunOrKeep(); closeSheet(); toTitle(); return;
    case 'retry': closeSheet(); newRun(); return;
    case 'title': closeSheet(); toTitle(); return;
    case 'tenure': openTenure(); return;
    case 'ach': openAch(); return;
    case 'pedia': openPedia(); return;
    case 'howto': openHow(); return;
    case 'continue': if (SAVE.run) { restore(SAVE.run); startGame(); toast(`Resuming at wave ${S.wave + 1}. Good luck, Doctor.`); } return;
    case 'new':
      if (SAVE.run) { showSheet('confirm', head('Start over?') + `<div class="sh-body"><div class="d" style="margin-bottom:12px">You have a run in progress at wave ${SAVE.run.wave + 1}. Starting a new experiment abandons it (no Citations).</div><div class="center-btns" style="padding:0"><button class="btn warn" data-a="newYes">🧪 Yes, new experiment</button><button class="btn alt" data-a="close">Keep my run</button></div></div>`, 'center'); return; }
      newRun(); return;
    case 'newYes': closeSheet(); SAVE.run = null; newRun(); return;
    case 'reset': showSheet('confirm', head('Reset everything?') + `<div class="sh-body"><div class="d" style="margin-bottom:12px">This wipes Citations, perks, achievements, records and your saved run. Forever.</div><div class="center-btns" style="padding:0"><button class="btn warn" data-a="reset2">🗑️ Yes, wipe it all</button><button class="btn alt" data-a="close">Cancel</button></div></div>`, 'center'); return;
    case 'reset2': SAVE.meta = { citations: 0, totalCit: 0, perks: {}, bestWave: 0, totalKills: 0, ach: {}, seen: {}, runs: 0, tut: 0 }; SAVE.run = null; persist(); closeSheet(); toTitle(); toast('Lab decontaminated. Fresh start!'); return;
  }
  refreshSheet();
}
function saveRunOrKeep() { if (S && S.phase === 'build') saveRun(); }

// ================= TITLE / FLOW =================
function refreshTitle() {
  const r = SAVE.run; $('#tCont').style.display = r ? '' : 'none'; if (r) $('#tContS').textContent = `Wave ${r.wave + 1} · $${fmt(r.cash)}`;
  $('#tCit').textContent = SAVE.meta.citations;
  $('#tStats').innerHTML = `Best wave: <b>${SAVE.meta.bestWave}</b> · Terris eliminated: <b>${fmt(SAVE.meta.totalKills)}</b> · Runs: <b>${SAVE.meta.runs}</b>`;
}
function toTitle() { if (S) S.phase = 'title'; S = null; input.down = false; $('#title').classList.remove('hidden'); refreshTitle(); }
function startGame() {
  $('#title').classList.add('hidden'); for (const k in last) delete last[k];
  renderDock(); renderHUD(); resize();
}
function newRun() {
  S = freshRun(); SAVE.run = snap(); persist(); startGame();
  banner('NEW EXPERIMENT', 'Protect the Magic Johnson Lab at all costs.', '#5dff9c');
  if (SAVE.meta.tut === 0) setTimeout(() => toast('👆 Tap a glowing ➕ bench to build a Pipette Turret ($100)'), 1200);
}

// ================= INPUT =================
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  ensureAudio(); if (!S || sheetOpen || (S.phase !== 'wave' && S.phase !== 'build')) return;
  const p = toLogical(e);
  for (let i = 0; i < SLOTS.length; i++) {
    if (dist2(p.x, p.y, SLOTS[i][0], SLOTS[i][1]) < 32 * 32) {
      if (i >= benchCount()) { toast('🔒 Buy Bench Space Expansion in SHOP → Lab'); sfx('nope'); return; }
      sfx('click'); openSlot(i); return;
    }
  }
  input.down = true; input.id = e.pointerId; input.x = p.x; input.y = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch (er) { }
});
cv.addEventListener('pointermove', e => { if (input.down && e.pointerId === input.id) { const p = toLogical(e); input.x = p.x; input.y = p.y; } });
const endPtr = e => { if (e.pointerId === input.id) input.down = false; };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr); cv.addEventListener('lostpointercapture', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (!S || S.phase === 'over') return;
  if (e.code === 'Space') { e.preventDefault(); if (!sheetOpen) startWave(); }
  else if (e.key === 's' || e.key === 'S') { sheetOpen ? closeSheet() : openShop(); }
  else if (e.key === 'Escape') { sheetOpen ? closeSheet() : openPause(); }
  else if (/^[1-9]$/.test(e.key)) { const ks = WKEYS.filter(k => S.owned[k]); const k = ks[+e.key - 1]; if (k) { equipW(k); renderDock(); } }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S) { input.down = false; if (S.phase === 'build') saveRun(); else if (S.phase === 'wave' && !sheetOpen) openPause(); } });
window.addEventListener('resize', () => { resize(); });

// ================= LOOP =================
let lastTs = 0, dockT = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016); lastTs = ts; ANIM += dt;
  if (S && !sheetOpen && !paused) {
    for (let i = 0; i < speed; i++) { if (S.phase !== 'wave' && S.phase !== 'build') break; update(dt); }
    dockT -= dt; if (dockT <= 0) { dockT = 0.5; const sig = WKEYS.map(k => S.owned[k] ? S.owned[k].lvl : 0).join() + '|' + PKEYS.map(k => S.pups[k] || 0).join() + '|' + S.equipped.join() + '|' + S.maxReached + '|' + (S.cash >= 100 ? Math.floor(Math.log2(S.cash)) : 0); if (sig !== last.dock) { last.dock = sig; renderDock(); } }
  }
  if (S) renderHUD();
  if (!$('#title').classList.contains('hidden')) renderTitle(dt);
  else render();
  requestAnimationFrame(frame);
}

// ================= BOOT =================
window.__game = { get S() { return S; }, startWave, newRun, setSpeed: v => { speed = v; }, buyWeapon, buildTower, upgradeTower, upgradeWeapon, buySkill, openShop, closeSheet, act };
refreshTitle();
resize();
requestAnimationFrame(t => { lastTs = t; requestAnimationFrame(frame); });
cloudInit();

</script>
</body>
</html>
